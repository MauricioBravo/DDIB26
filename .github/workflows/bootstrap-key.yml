name: Bootstrap SSH Key

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Public key to add to the server's authorized_keys
        required: true

jobs:
  add-key:
    runs-on: ubuntu-latest
    steps:
      - name: Set up deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Add new public key to authorized_keys
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'grep -qxF "${{ github.event.inputs.public_key }}" ~/.ssh/authorized_keys 2>/dev/null || echo "${{ github.event.inputs.public_key }}" >> ~/.ssh/authorized_keys'
